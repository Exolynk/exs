name: CI and Pages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Rust and Playground
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.95.0 toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint Wasm runtime
        run: cargo clippy -p exs-runtime --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Verify committed runtime Wasm template
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }--remap-path-prefix=${cargo_home}=/cargo" \
            cargo rustc -p exs-runtime --target wasm32-unknown-unknown --release --crate-type cdylib -- -C link-arg=--export-memory
          if ! cmp --silent target/wasm32-unknown-unknown/release/exs_runtime.wasm crates/exs-runtime/exs-runtime.wasm; then
            echo "The committed runtime template is stale. Run: nu crates/exs-runtime/build-runtime.nu"
            exit 1
          fi
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build playground
        working-directory: examples/playground
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

  deploy-playground:
    name: Deploy Playground to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.95.0 toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build playground
        working-directory: examples/playground
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/playground/dist
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
