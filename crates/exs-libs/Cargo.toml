[package]
name = "exs-libs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal crate of ExS: optional library modules such as json and url, with their host functions. Use the exs crate; this one has no stability promise"

[lints]
workspace = true

[features]
default = ["server", "json", "url", "rand"]
# Registers the host functions with the native server runner.
server = ["exs-runner/server"]
# Registers the host functions with the browser runner.
browser = ["exs-runner/browser"]
# Provides library sources as `exs_compiler::Source` and adds them to `exs_compiler::Sources`.
compiler = ["dep:exs-compiler"]
json = ["dep:serde", "dep:serde_json"]
url = ["dep:form_urlencoded", "dep:percent-encoding"]
rand = ["dep:getrandom", "dep:js-sys", "dep:wasm-bindgen"]
# Not a default feature: it pulls in an HTTP client, and native requests need a tokio runtime.
http = ["json", "dep:reqwest", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
exs-abi.workspace = true
exs-runner.workspace = true
exs-compiler = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0.145", optional = true }
form_urlencoded = { version = "1.2.2", optional = true }
percent-encoding = { version = "2.3.2", optional = true }

# Native targets: the operating system's random source and the HTTP client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.3.4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

# Browsers: `crypto.getRandomValues` and `fetch`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.103", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }
web-sys = { version = "0.3.80", features = ["AbortSignal", "Headers", "Request", "RequestInit", "Response"], optional = true }

[dev-dependencies]
exs-compiler.workspace = true

# Native HTTP tests run the requests in a tokio runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }

[[test]]
name = "libraries"
required-features = ["server", "json", "url", "rand"]

[[test]]
name = "http"
required-features = ["server", "http"]
