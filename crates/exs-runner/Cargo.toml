[package]
name = "exs-runner"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
server = ["dep:wasmtime"]
browser = ["dep:jiff", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
serde = ["dep:serde", "exs-abi/serde"]

[dependencies]
exs-abi = { path = "../exs-abi" }
exs-core = { path = "../exs-core" }
serde = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true, optional = true }
jiff = { workspace = true, features = ["std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.103", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }
jiff = { workspace = true, optional = true, features = ["std", "js", "tz-fat", "tzdb-bundle-always"] }

[dev-dependencies]
# Runner tests build small modules from WebAssembly text.
wasmtime = { workspace = true, features = ["wat"] }
exs-compiler = { path = "../exs-compiler" }

[[bench]]
name = "basic_script"
harness = false
