[package]
name = "exs-rust-guest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[features]
smoke = ["dep:exs-runner"]

[dependencies]
exs-guest = { path = "../../crates/exs-guest" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
exs-runner = { path = "../../crates/exs-runner", optional = true }

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["smoke"]
