[package]
name = "exs-browser-check"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
exs-abi = { path = "../../crates/exs-abi" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
exs-compiler = { path = "../../crates/exs-compiler" }
exs-runner = { path = "../../crates/exs-runner", default-features = false, features = ["browser"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
exs-compiler = { path = "../../crates/exs-compiler" }
exs-runner = { path = "../../crates/exs-runner" }
