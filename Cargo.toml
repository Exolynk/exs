[workspace]
members = [
    "crates/exs-abi",
    "crates/exs-layout",
    "crates/exs-core",
    "crates/exs-core-template",
    "crates/exs-guest",
    "crates/exs-compiler",
    "crates/exs-autocomplete",
    "crates/exs-runner",
    "crates/exs-libs",
    "crates/exs-cli",
    "examples/playground",
    "examples/rust-guest",
    "examples/fuel-baseline",
    "examples/browser-check",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
wasm-encoder = { version = "0.245.1", features = ["wasmparser"] }
wasmparser = "0.245.1"
# Only the core runtime, async execution and the two code generators: no component model, GC,
# threads, caching, profiling or debugging support, and no WebAssembly text parsing. Async lets
# running guest code yield to the executor.
wasmtime = { version = "47.0.3", default-features = false, features = [
    "std",
    "runtime",
    "async",
    "cranelift",
    "winch",
    "parallel-compilation",
] }
dlmalloc = { version = "0.2", features = ["global"] }
jiff = { version = "0.2.35", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
