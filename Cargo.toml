[workspace]
members = [
    "crates/exs-value",
    "crates/exs-abi",
    "crates/exs-runtime",
    "crates/exs-compiler",
    "crates/exs-runner",
    "crates/exs-cli",
    "examples/playground",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
wasm-encoder = { version = "0.245.1", features = ["wasmparser"] }
wasmparser = "0.245.1"
wasmtime = "41.0.2"
dlmalloc = { version = "0.2", features = ["global"] }
minicbor = { version = "0.26", default-features = false, features = ["alloc"] }
